  <line x1="22" y1="11" x2="22" y2="18.5" stroke="#7A2E2E" stroke-width="1.5" />
  <!-- Abutment base line -->
  <line x1="3" y1="24" x2="8" y2="24" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="24" x2="29" y2="24" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" />
