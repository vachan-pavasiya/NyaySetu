services:
  # ============================================================================
  # 1. Backend API Web Service (Docker + Persistent Disk)
  # ============================================================================
  - type: web
    name: compliance-radar-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: compliance-radar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: SERVICE_LAG_DAYS
        sync: false
      - key: DAILY_GEMINI_BUDGET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ============================================================================
  # 2. Frontend Static Site
  # ============================================================================
  - type: web
    name: compliance-radar-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: compliance-radar-api
          property: host
