services:
  # ============================================================================
  # 1. Backend API Web Service
  # ============================================================================
  - type: web
    name: compliance-radar-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python scripts/bootstrap.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: compliance-radar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/compliance_radar.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-1.5-flash
      - key: DAILY_GEMINI_BUDGET
        value: "250"
      - key: S3_BUCKET
        value: indian-high-court-judgments
      - key: AWS_DEFAULT_REGION
        value: ap-south-1
      - key: SERVICE_LAG_DAYS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: .

  # ============================================================================
  # 2. Frontend Static Site
  # ============================================================================
  - type: web
    name: compliance-radar-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: compliance-radar-api
          property: host

